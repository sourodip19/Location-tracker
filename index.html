<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Distance Tracker 💕</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  
  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <style>
    body {
      background: linear-gradient(to right, #ffdde1, #ee9ca7); /* soft pink gradient */
    }
    #map {
      height: 400px;
    }
    .custom-heart-icon {
      font-size: 24px;
      line-height: 1;
      text-shadow: 1px 1px 2px #ff69b4;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 space-y-6 text-center text-gray-800">

  <h1 class="text-4xl font-bold">💖 Our Love Distance Tracker 💖</h1>
  
  <button
    id="getLocationBtn"
    class="bg-pink-500 hover:bg-pink-600 text-white font-semibold py-2 px-6 rounded-full shadow"
  >
    📍 Show My Location
  </button>

  <div id="location" class="text-lg font-medium"></div>
  <div id="map" class="w-full max-w-3xl rounded shadow"></div>

  <div id="distance" class="text-2xl font-bold mt-4 text-pink-700"></div>

  <script>
    const button = document.getElementById('getLocationBtn');
    const locationDiv = document.getElementById('location');
    const distanceDiv = document.createElement('div');
    distanceDiv.className = "text-pink-700 text-xl font-semibold mt-4";
    document.body.appendChild(distanceDiv);
  
    // Girlfriend's coordinates
    const gfLat = 31.2526;
    const gfLng = 75.7040;
  
    let map = L.map('map').setView([gfLat, gfLng], 6); // initialize map with girlfriend's location
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
  
    // Custom heart icon for girlfriend's location
    const heartIcon = L.divIcon({
      className: 'custom-heart-icon',
      html: '💖',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    // Add GF marker with custom heart icon
    L.marker([gfLat, gfLng], { icon: heartIcon })
      .addTo(map)
      .bindPopup("💖 Her Location 💖");

    let marker, loveLine;
  
    button.addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
  
            locationDiv.innerHTML = `🧡 <strong>Your Location:</strong> ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  
            // Your location marker
            if (marker) {
              marker.setLatLng([lat, lng]);
            } else {
              marker = L.marker([lat, lng])
                .addTo(map)
                .bindPopup("💙 Your Location 💙")
                .openPopup();
            }
  
            // Remove previous line if it exists
            if (loveLine) {
              map.removeLayer(loveLine);
            }
  
            const points = [
              [lat, lng],
              [gfLat, gfLng]
            ];
  
            const distance = getDistanceFromLatLonInKm(lat, lng, gfLat, gfLng);
  
            // Draw love line with distance tooltip
            loveLine = L.polyline(points, {
              color: 'hotpink',
              weight: 4,
              dashArray: '5, 10'
            }).addTo(map)
              .bindTooltip(`💕 ${distance.toFixed(2)} km 💕`, {
                permanent: true,
                direction: 'center',
                className: 'text-pink-700 text-lg font-bold bg-white px-2 py-1 rounded'
              })
              .openTooltip();
  
            // Fit map to both markers
            map.fitBounds(points, { padding: [50, 50] });
  
            distanceDiv.innerHTML = `You are <span class="text-3xl font-extrabold">${distance.toFixed(2)} km</span> away from me 💘`;
          },
          (error) => {
            locationDiv.innerHTML = `<span class="text-red-600">❌ Error: ${error.message}</span>`;
          }
        );
      } else {
        locationDiv.innerHTML = `<span class="text-red-600">❌ Geolocation not supported</span>`;
      }
    });
  
    // Distance formula
    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = deg2rad(lat2 - lat1);
      const dLon = deg2rad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }
  
    function deg2rad(deg) {
      return deg * (Math.PI / 180);
    }
  </script>
  
</body>
</html>
